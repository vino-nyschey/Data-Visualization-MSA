<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSA Visualization</title>
</head>
<body>
    <h1>Select Fasta File</h1>
    <form action="/msa" method="post">
        <select name="file">
            {% for file in files %}
            <option value="{{ file }}">{{ file.split('_')[0] }}</option>
            {% endfor %}
        </select>
        <button type="submit">Visualize</button>
    </form>
</body>
</html>
