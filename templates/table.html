<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='protein.ico') }}">
    <title>Protein Data Table</title>
    <style>
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>Protein Data Table</h2>

<table>
    <thead>
        <tr>
            <th>Sequence ID</th>
            <th>PDB ID</th>
            <th>Organism</th>
            <th>Protein Name</th>
            <th>Protein Family</th>
        </tr>
    </thead>
    <tbody>
        {% for entry in data %}
            <tr>
                <td>{{ entry['Sequence ID'] }}</td>
                <td>{{ entry['PDB ID'] }}</td>
                <td>{{ entry['Organism'] }}</td>
                <td>{{ entry['Protein Name'] }}</td>
                <td>{{ entry['Protein Family']}}</td>
            </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
