<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_species.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='protein.ico') }}">
    <title>Protein Data Visualization</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script>
        function selectAll() {
            var checkboxes = document.querySelectorAll('input[name="species"]');
            var selectAllCheckbox = document.getElementById('select-all');
    
            checkboxes.forEach(function(checkbox) {
                checkbox.checked = selectAllCheckbox.checked;
            });
        }
    </script>
</head>
<body>

<h2>Protein Data Visualization</h2>

<!-- Form for species selection -->
<form method="post" action="/species" style="text-align: center;">
    <label><input type="checkbox" id="select-all" onclick="selectAll()"> Select All</label>
    {% for species in species %}
        <input type="checkbox" name="species" value="{{ species }}" id="{{ species }}" {% if species in request.form.getlist('species') %}checked{% endif %} >
        <label for="{{ species }}" class="capitalize">{{ species | capitalize }}</label>
    {% endfor %}
    <button type="submit">Refresh Plot</button>

    <script>
        //capitalize the first letter of each word
        document.addEventListener('DOMContentLoaded', function () {
            var buttons = document.querySelectorAll('.capitalize');

            buttons.forEach(function (button) {
                var words = button.textContent.split(' ');
                for (var i = 0; i < words.length; i++) {
                    words[i] = words[i].charAt(0).toUpperCase() + words[i].slice(1).toLowerCase();
                }
                labuttonbel.textContent = words.join(' ');
            });
        });
    </script>
</form>

<!-- Display selected species -->
<div id="selected-species">
    {% if selected_species %}
        <strong>Selected Species:</strong> {{ selected_species | join(', ') }}
    {% endif %}
</div>

<!-- Plotly bubble chart container -->
<div id="bubble-chart">
    {{ bubble_chart_html | safe }}
</div>

<!-- Plotly pie chart container -->
<div class="pie-charts-container">
    <!-- first container -->
    <div id="pie-chart">
        {{ pie_chart_html | safe }}
    </div>
    <!-- second container -->
    <div id="pie_chart"></div>
    <script>
        var chart_data = {{ chart_data_org | safe }};
        console.log(chart_data);  // Add this line for debugging
        Plotly.newPlot('pie_chart', chart_data.data, chart_data.layout);
    </script>
</div>

<!-- Plotly bar chart container -->
<div id="bar_chart"></div>
<script>
    var chart_data = {{ chart_data_pro | safe }};
    console.log(chart_data);  // Add this line for debugging
    Plotly.newPlot('bar_chart', chart_data.data, chart_data.layout);
</script>

</body>
</html>
