<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Information Visualization</title>
</head>
<body>
    <h1>Protein Information</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Sequence ID</th>
                <th>PDB ID</th>
                <th>Protein Name</th>
                <th>Founded Date</th>
                <th>Organism</th>
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
                <tr>
                    <td>{{ row['Sequence ID'] }}</td>
                    <td>{{ row['PDB ID'] }}</td>
                    <td>{{ row['Protein Name'] }}</td>
                    <td>{{ row['Founded Date'] }}</td>
                    <td>{{ row['Organism'] }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
